 $('charName').textContent=(own?'':'🔒 ')+c.n[L];$('charPerk').innerHTML=c.d[L]+' <i>'+c.p[L]+'</i>';$('misBadge').classList.toggle('hidden',!save.misNew);const dg=dailyIdx()>=0;$('giftBadge').classList.toggle('hidden',!dg);$('giftBtn').classList.toggle('wig',dg);
 let sh='<span>'+tr('skin')+': '+sk2.n[L]+'</span>';c.skins.forEach((s,i)=>{sh+='<button class="sw'+(i===viewSkin?' on':'')+(ownedSkins(viewChar).includes(i)?'':' lock')+'" data-s="'+i+'" style="--c:'+hex(s.m)+'"></button>';});$('skins').innerHTML=sh;
 const ready=own&&skOwn;$('playBtn').textContent=tr('play');$('playBtn').classList.toggle('hidden',!ready);const b=$('buyC');b.classList.toggle('hidden',ready);const price=!own?c.price:sk2.p;b.innerHTML=(!own?'🔓 ':'🎨 ')+barH+' '+price;b.disabled=save.coins<price;
 let h='';for(const k of['bc2','bs2','bstart']){const n=save.boosts[k];h+='<button class="chip'+(save.sel[k]&&n>0?' on':'')+'" data-b="'+k+'" title="'+tr('b_'+k)+'" '+(n>0?'':'disabled')+'>'+BOOST_ICON[k]+' '+BOOST_TAG[k]+' <b>'+n+'</b></button>';}
 h+='<button class="chip" disabled title="'+tr('b_board')+'">🛹 <b>'+save.boards+'</b></button>';$('boostBar').innerHTML=h;}
$('boostBar').onclick=e=>{const b=e.target.closest('[data-b]');if(!b||b.disabled)return;const k=b.dataset.b;save.sel[k]=!save.sel[k];store();SFX.click();refreshMenu();};
$('skins').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;viewSkin=+b.dataset.s;if(save.owned.includes(viewChar)&&ownedSkins(viewChar).includes(viewSkin)){save.skin[viewChar]=viewSkin;store();}buildHero(viewChar,viewSkin);G.cheerT=0.7;SFX.click();refreshMenu();};
function switchChar(d){viewChar=(viewChar+d+CHARS.length)%CHARS.length;viewSkin=skinOf(viewChar);if(save.owned.includes(viewChar)){save.char=viewChar;store();}buildHero(viewChar,viewSkin);G.cheerT=0.9;G.swapT=0.5;SFX.click();refreshMenu();}
$('prevC').onclick=()=>switchChar(-1);$('nextC').onclick=()=>switchChar(1);
$('buyC').onclick=()=>{const c=CHARS[viewChar],own=save.owned.includes(viewChar);const price=own?c.skins[viewSkin].p:c.price;if(save.coins<price){toast(tr('notEnough'));return;}save.coins-=price;
 if(!own){save.owned.push(viewChar);save.char=viewChar;toast(tr('newHero'));if(viewSkin!==0&&!ownedSkins(viewChar).includes(viewSkin)){viewSkin=0;buildHero(viewChar,0);}}
 else{save.skins[viewChar]=ownedSkins(viewChar).concat([viewSkin]);save.char=viewChar;toast(tr('newSkin'));}save.skin[viewChar]=viewSkin;store();SFX.buy();SFX.roar();vibe(50);G.cheerT=1.6;burst(0,1.6,0.5,40,0x9aff6a,6,0.5);confetti();refreshMenu();};
let shopTab='up';
function pips(lv){let s='<div class="pips">';for(let i=0;i<5;i++)s+='<i class="'+(i<lv?'f':'')+'"></i>';return s+'</div>';}
const UPC=[250,500,1000,2000,4000];
function renderShop(){$('bank2').textContent=save.coins.toLocaleString('ru-RU');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===shopTab));let h='';
 if(shopTab==='up'){for(const k of POW_KEYS){const lv=save.up[k],cost=UPC[lv],p=POW[k];h+='<div class="sc" style="--c:'+p.c+'"><div class="ico">'+p.icon+'</div><b>'+tr('p_'+k)+'</b><small>'+tr('d_'+k)+'<br>⏱ '+powDur(k)+' '+tr('sec')+'</small>'+pips(lv)+(lv>=5?'<button class="btn" disabled>'+tr('max')+'</button>':'<button class="btn green" data-up="'+k+'">'+barH+' '+cost+'</button>')+'</div>';}}
 else{for(const k of['bc2','bs2','bstart','board']){const n=k==='board'?save.boards:save.boosts[k];h+='<div class="sc" style="--c:'+BOOST_C[k]+'"><div class="cnt">'+tr('have')+': '+n+'</div><div class="ico">'+BOOST_ICON[k]+'</div><b>'+tr('b_'+k)+'</b><small>'+tr('db_'+k)+'</small><button class="btn green" data-bb="'+k+'">'+barH+' '+BOOST_PRICE[k]+'</button></div>';}}
 $('shopGrid').innerHTML=h;}
$('shopGrid').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let cost=0;
 if(b.dataset.up){const k=b.dataset.up;cost=UPC[save.up[k]];if(save.coins<cost){toast(tr('notEnough'));SFX.stumble();return;}save.coins-=cost;save.up[k]++;}
 else if(b.dataset.bb){const k=b.dataset.bb;cost=BOOST_PRICE[k];if(save.coins<cost){toast(tr('notEnough'));SFX.stumble();return;}save.coins-=cost;if(k==='board')save.boards++;else save.boosts[k]++;}
 store();SFX.buy();vibe(25);toast(tr('bought'));renderShop();refreshMenu();};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{shopTab=t.dataset.tab;SFX.click();renderShop();});
function openShop(){renderShop();$('shop').classList.remove('hidden');SFX.click();}
$('shopBtn').onclick=openShop;$('overShop').onclick=openShop;$('shopBack').onclick=()=>{$('shop').classList.add('hidden');SFX.click();refreshMenu();};
$('misBtn').onclick=()=>{$('mlv').innerHTML=mlvHTML();$('misList').innerHTML=misHTML();$('missions').classList.remove('hidden');save.misNew=false;store();refreshMenu();SFX.click();};$('misClose').onclick=()=>{$('missions').classList.add('hidden');SFX.click();};
$('multB').onclick=()=>$('misBtn').onclick();
// ---------- daily gift ----------
const DAILY=[{b:100},{bd:1},{b:200},{bo:'bc2'},{b:350},{bo:'bstart'},{b:1000,bd:2}];
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function dailyIdx(){const D=save.daily,t=dstr(new Date());if(D.last===t)return -1;const y=dstr(new Date(Date.now()-864e5));return D.last===y?D.streak%7:0;}
function rewHTML(r){let s='';if(r.b)s+=barH+' '+r.b;if(r.bd)s+=(s?' + ':'')+'🛹 x'+r.bd;if(r.bo)s+=BOOST_ICON[r.bo]+' '+BOOST_TAG[r.bo];return s;}
function renderDaily(){const idx=dailyIdx(),can=idx>=0,pos=can?idx:((save.daily.streak-1)%7+7)%7;let h='';DAILY.forEach((r,i)=>{const got=i<pos||(!can&&i===pos);h+='<div class="day'+(i===6?' big':'')+(got?' got':'')+(can&&i===pos?' now':'')+'"><span>'+tr('dayN')+' '+(i+1)+'</span><i>'+(r.bo?BOOST_ICON[r.bo]:i===6?'💎':r.bd?'🛹':'🟩')+'</i><span style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center">'+rewHTML(r)+'</span></div>';});$('days').innerHTML=h;const b=$('dailyBtn');b.textContent=can?tr('claim'):tr('claimed');b.disabled=!can;b.classList.toggle('pulse',can);}
function openDaily(){renderDaily();$('daily').classList.remove('hidden');SFX.click();}
function claimDaily(){const idx=dailyIdx();if(idx<0)return;const r=DAILY[idx],y=dstr(new Date(Date.now()-864e5));save.daily.streak=save.daily.last===y?save.daily.streak+1:1;save.daily.last=dstr(new Date());if(r.b)save.coins+=r.b;if(r.bd)save.boards+=r.bd;if(r.bo)save.boosts[r.bo]++;store();SFX.box();vibe(50);confetti();G.cheerT=1.6;toast('🎁 '+tr('daily')+'!');renderDaily();refreshMenu();}
$('giftBtn').onclick=openDaily;$('dailyBtn').onclick=claimDaily;$('dailyClose').onclick=()=>{$('daily').classList.add('hidden');SFX.click();};
// ---------- stats ----------
function renderStats(){const s=save.st,L=save.lang,f=v=>Math.floor(v).toLocaleString('ru-RU');const row=(k,v)=>'<div class="row2"><span>'+tr(k)+'</span><b>'+v+'</b></div>';
 let h='<div class="mlv">'+mlvHTML()+'</div>'+row('best','🏆 '+f(save.best))+row('s_runs',f(s.runs))+row('s_dist',f(s.dist)+' m')+row('s_bars',f(s.bars))+row('s_jumps',f(s.jumps))+row('s_combo','x'+f(s.combo))+row('s_near',f(s.near))+row('s_mis',f(save.mdone));
 h+='<h3 style="margin:16px 0 6px;color:#ffd04a;font-size:20px">🏅 '+tr('s_top')+'</h3>';if(!s.top.length)h+='<div class="row2" style="justify-content:center">—</div>';
 s.top.forEach((t,i)=>{h+='<div class="row2"><span>'+['🥇','🥈','🥉','4.','5.'][i]+' '+(CHARS[t.c]?CHARS[t.c].n[L]:'')+' · '+f(t.d)+' m</span><b>'+f(t.s)+'</b></div>';});$('statList').innerHTML=h;}
$('statBtn').onclick=()=>{renderStats();$('stats').classList.remove('hidden');SFX.click();};$('statClose').onclick=()=>{$('stats').classList.add('hidden');SFX.click();};
// ---------- settings ----------
function renderSettings(){$('togMusic').classList.toggle('on',save.music);$('togSfx').classList.toggle('on',save.sfx);$('togVib').classList.toggle('on',save.vib);$('togShake').classList.toggle('on',save.shake);$('togFull').classList.toggle('on',!!(document.fullscreenElement||document.webkitFullscreenElement));$('volM').value=save.mv;$('volS').value=save.sv;$('qHi').classList.toggle('sel',save.hq);$('qLo').classList.toggle('sel',!save.hq);$('lRu').classList.toggle('sel',save.lang==='ru');$('lUk').classList.toggle('sel',save.lang==='uk');}
function openSettings(){renderSettings();const s=$('settings');s.style.zIndex=7;s.classList.remove('hidden');SFX.click();}
$('setBtn').onclick=openSettings;$('pauseSet').onclick=openSettings;$('setClose').onclick=()=>{$('settings').classList.add('hidden');SFX.click();};
$('togMusic').onclick=()=>{audioInit();save.music=!save.music;store();applyVol();renderSettings();SFX.click();};
$('togSfx').onclick=()=>{audioInit();save.sfx=!save.sfx;store();applyVol();renderSettings();SFX.click();};
$('togVib').onclick=()=>{save.vib=!save.vib;store();renderSettings();vibe(40);SFX.click();};
$('togFull').onclick=()=>{const d=document,e=d.documentElement;try{if(!(d.fullscreenElement||d.webkitFullscreenElement)){const f=e.requestFullscreen||e.webkitRequestFullscreen;if(f){const p=f.call(e);if(p&&p.catch)p.catch(()=>{});}}else{const f=d.exitFullscreen||d.webkitExitFullscreen;if(f)f.call(d);}}catch(x){}SFX.click();setTimeout(renderSettings,350);};
$('togShake').onclick=()=>{save.shake=!save.shake;store();renderSettings();SFX.click();};
$('volM').oninput=e=>{audioInit();save.mv=+e.target.value;if(save.mv>0)save.music=true;store();applyVol();renderSettings();};
$('volS').oninput=e=>{audioInit();save.sv=+e.target.value;if(save.sv>0)save.sfx=true;store();applyVol();renderSettings();};$('volS').onchange=()=>SFX.coin(4);
$('qHi').onclick=()=>{save.hq=true;store();applyQuality();renderSettings();};$('qLo').onclick=()=>{save.hq=false;store();applyQuality();renderSettings();};
$('resetBtn').onclick=()=>{if(confirm(tr('resetQ'))){try{localStorage.removeItem('dinoRush4');}catch(e){}location.reload();}};
function setLang(l){save.lang=l;store();applyI18n();refreshMenu();renderSettings();if(!$('shop').classList.contains('hidden'))renderShop();if(!$('missions').classList.contains('hidden')){$('mlv').innerHTML=mlvHTML();$('misList').innerHTML=misHTML();}if(!$('daily').classList.contains('hidden'))renderDaily();if(!$('stats').classList.contains('hidden'))renderStats();SFX.click();}
$('lRu').onclick=()=>setLang('ru');$('lUk').onclick=()=>setLang('uk');
document.querySelectorAll('.toMenu').forEach(b=>b.onclick=()=>{if(G.state==='pause'){save.coins+=Math.floor(G.coins);store();}SFX.click();showMenu();});
$('playBtn').onclick=()=>{audioInit();startRun();};$('againBtn').onclick=()=>{startRun();};
$('revBtn').onclick=()=>doRevive();$('revNo').onclick=()=>{SFX.click();finishRun();};
function togglePause(){if(G.state==='play'){G.state='pause';stopEngine();$('danger').classList.remove('on');$('rageFx').classList.remove('on');$('pauseMis').innerHTML=misHTML();$('pause').classList.remove('hidden');}else if(G.state==='pause'){$('pause').classList.add('hidden');$('settings').classList.add('hidden');startCount();}}
$('pauseBtn').onclick=e=>{e.stopPropagation();togglePause();};$('resumeBtn').onclick=()=>togglePause();
$('boardBtn').onclick=e=>{e.stopPropagation();useBoard();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')togglePause();});
const KEYS={arrowleft:'left',a:'left','ф':'left',arrowright:'right',d:'right','в':'right',arrowup:'up',w:'up','ц':'up',' ':'up',arrowdown:'down',s:'down','ы':'down','і':'down'};
function modalOpen(){return['shop','settings','pause','over','missions','revive','daily','stats'].some(id=>!$(id).classList.contains('hidden'));}
const canPlay=()=>save.owned.includes(viewChar)&&ownedSkins(viewChar).includes(viewSkin);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(KEYS[k]){e.preventDefault();if(e.repeat)return;if(G.state==='play')act(KEYS[k]);else if(G.state==='menu'&&!modalOpen()){if(k==='arrowleft'||k==='a')switchChar(-1);else if(k==='arrowright'||k==='d')switchChar(1);else if(k===' '&&canPlay())startRun();}return;}
 if(k==='escape'||k==='p'||k==='з')togglePause();else if(k==='b'||k==='и'||k==='e'||k==='у'||k==='shift')useBoard();
 else if(k==='enter'){if(G.state==='menu'&&!modalOpen()&&canPlay())startRun();else if(G.state==='over'&&!$('revive').classList.contains('hidden'))doRevive();else if(G.state==='over'&&!$('over').classList.contains('hidden')&&$('shop').classList.contains('hidden'))startRun();}});
let sw=null,lastTap=0;
renderer.domElement.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY,done:false};});
addEventListener('pointermove',e=>{if(!sw||sw.done)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24){sw.done=true;const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');if(G.state==='play')act(dir);else if(G.state==='menu'&&!modalOpen()&&(dir==='left'||dir==='right'))switchChar(dir==='left'?1:-1);}});
addEventListener('pointerup',()=>{if(sw&&!sw.done&&G.state==='play'){const n=performance.now();if(n-lastTap<320)useBoard();lastTap=n;}sw=null;});
applyI18n();applyQuality();camera.position.set(0,2.0,5.4);showMenu();$('loadBar').style.width='100%';
addEventListener('contextmenu',e=>e.preventDefault());
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{$('loading').classList.add('fade');setTimeout(()=>$('loading').classList.add('hidden'),550);},500);requestAnimationFrame(loop);
</script>
